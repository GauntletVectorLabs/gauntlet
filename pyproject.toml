[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gauntlet-agent"
version = "0.1.0"
description = "Break your agent before your users do. Adversarial stress-testing and regression suites for AI agents."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Rohan Pandey" }]
keywords = ["ai", "agents", "llm", "evaluation", "red-team", "testing", "reliability", "ci"]
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=7"]

[project.scripts]
gauntlet = "gauntlet.cli:main"

[tool.setuptools]
packages = ["gauntlet"]
